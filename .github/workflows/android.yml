name: Build TravelLog APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Create jlink wrapper
        run: |
          mkdir -p /home/runner/.local/bin
          echo '#!/bin/bash
          OUT="" MP=""
          for((i=0;i<${#@};i++));do a="${@:$i:1}";[ "$a"="--output" ]&&OUT="${@:$((i+1)):1}";[ "$a"="--module-path" ]&&MP="${@:$((i+1)):1}";done
          if [ -n "$MP" ]&&[ -n "$OUT" ]&&[ -f "$MP/java.base.jmod" ];then
            mkdir -p "$OUT/lib"
            D=$(mktemp -d)&&cd "$D"&&"${JAVA_HOME}/bin/jmod" extract "$MP/java.base.jmod" 2>/dev/null
            cp -r lib/* "$OUT/lib/" 2>/dev/null
            rm -rf "$D";exit 0;fi
          ' > /home/runner/.local/bin/jlink
          chmod +x /home/runner/.local/bin/jlink

      - name: Build APK
        run: PATH="/home/runner/.local/bin:$PATH" gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TravelLog-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "TravelLog Build #${{ github.run_number }}"
          body: "Download app-debug.apk below."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
